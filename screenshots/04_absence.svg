<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">

<defs>
  <!-- 激光点光晕 -->
  <filter id="laserGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="laserGlowSm" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <!-- 扫描线光晕 -->
  <filter id="scanGlow" x="-20%" y="-200%" width="140%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
  </filter>
  <!-- 背景渐变 -->
  <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
    <stop offset="0%"  stop-color="#1A1A24"/>
    <stop offset="100%" stop-color="#0A0A0E"/>
  </radialGradient>
</defs>

<rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- 大数字倒计时 -->
  <text x="400" y="270" font-family="Source Han Sans SC, sans-serif" font-size="88" font-weight="200" fill="#4DA8FF" text-anchor="middle">5:00</text>
  <text x="400" y="310" font-family="Source Han Sans SC, sans-serif" font-size="16" font-weight="400" fill="#8E8E93" text-anchor="middle">后进入休眠</text>

  <!-- 进度环 -->
  <circle cx="400" cy="380" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="6"/>
  <circle cx="400" cy="380" r="42" fill="none" stroke="#008CFF" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="264" stroke-dashoffset="80" transform="rotate(-90 400 380)" filter="url(#laserGlow)"/>

  <circle cx="14" cy="20" r="3" fill="#008CFF"/>
<text x="24" y="25" font-family="Source Han Sans SC, sans-serif" font-size="13" font-weight="600" fill="#F5F5F7">FaceGuard</text>
<text x="100" y="25" font-family="Source Han Sans SC, sans-serif" font-size="11" fill="#8E8E93">Away · 离开模式</text>
  <rect x="0" y="570" width="800" height="30" fill="#0A0A0E" opacity="0.8"/>
<circle cx="16" cy="585" r="3" fill="#008CFF"/>
<text x="28" y="590" font-family="Source Han Sans SC, sans-serif" font-size="12" font-weight="500" fill="#F5F5F7">用户已离开 · 已锁屏 · 5 分钟后休眠</text>
</svg>