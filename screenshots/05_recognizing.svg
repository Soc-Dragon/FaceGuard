      <stop offset="100%" stop-color="#5EEAB5" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="490" y="270" width="250" height="8" rx="4.0" fill="rgba(255,255,255,0.1)"/>
  <rect x="490" y="270" width="167.5" height="8" rx="4.0" fill="url(#pg_490_270)" filter="url(#bloom)"/>
  <text x="740" y="260" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#5EEAB5" fill-opacity="1.0" text-anchor="end">2/3</text>

  <!-- 特征提取状态 -->
  <text x="490" y="305" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="500" fill="#AEAEB2" fill-opacity="1.0" text-anchor="start">特征提取</text>
  
  <defs>
    <linearGradient id="pg_490_315" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#409CFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#409CFF" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="490" y="315" width="250" height="8" rx="4.0" fill="rgba(255,255,255,0.1)"/>
  <rect x="490" y="315" width="212.5" height="8" rx="4.0" fill="url(#pg_490_315)" filter="url(#bloom)"/>
  <text x="740" y="305" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#409CFF" fill-opacity="1.0" text-anchor="end">85%</text>

  <!-- 活体检测 -->
  <text x="490" y="350" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="500" fill="#AEAEB2" fill-opacity="1.0" text-anchor="start">活体检测</text>
  
  <defs>
    <linearGradient id="pg_490_360" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#D070FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D070FF" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="490" y="360" width="250" height="8" rx="4.0" fill="rgba(255,255,255,0.1)"/>
  <rect x="490" y="360" width="230.0" height="8" rx="4.0" fill="url(#pg_490_360)" filter="url(#bloom)"/>
  <text x="740" y="350" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#D070FF" fill-opacity="1.0" text-anchor="end">92%</text>

  <!-- 模型信息 -->
  
  <!-- 玻璃面板 @(480,390) 270x28 -->
  <defs>
