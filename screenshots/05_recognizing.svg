        stroke="#5EEAB5" stroke-width="2" stroke-dasharray="10 6" opacity="0.8" filter="url(#bloom)"/>

  <!-- 扫描线 -->
  
  <!-- 扫描线泛光带 -->
  <rect x="160" y="130" width="220" height="230" fill="none"/>
  <rect x="160" y="213.5" width="220" height="40" fill="#5EEAB5" opacity="0.08" filter="url(#glassBlur)"/>
  <rect x="160" y="225.5" width="220" height="16" fill="#5EEAB5" opacity="0.2" filter="url(#glassBlurSm)"/>
  <!-- 主扫描线 -->
  <rect x="160" y="232.5" width="220" height="2" fill="#5EEAB5" filter="url(#bloom)"/>

  <!-- 关键点连线 -->
<line x1="231.0" y1="230.5" x2="309.0" y2="230.5" stroke="#5EEAB5" stroke-width="1" stroke-opacity="0.35"/>
<line x1="309.0" y1="230.5" x2="270" y2="256.5" stroke="#5EEAB5" stroke-width="1" stroke-opacity="0.35"/>
<line x1="270" y1="256.5" x2="241.4" y2="295.5" stroke="#5EEAB5" stroke-width="1" stroke-opacity="0.35"/>
<line x1="270" y1="256.5" x2="298.6" y2="295.5" stroke="#5EEAB5" stroke-width="1" stroke-opacity="0.35"/>
<line x1="241.4" y1="295.5" x2="298.6" y2="295.5" stroke="#5EEAB5" stroke-width="1" stroke-opacity="0.35"/>
<!-- 发光关键点 -->
<circle cx="231.0" cy="230.5" r="8" fill="#5EEAB5" opacity="0.25" filter="url(#bloom)"/>
<circle cx="231.0" cy="230.5" r="3" fill="#ffffff" filter="url(#softGlow)"/>
<circle cx="309.0" cy="230.5" r="8" fill="#5EEAB5" opacity="0.25" filter="url(#bloom)"/>
<circle cx="309.0" cy="230.5" r="3" fill="#ffffff" filter="url(#softGlow)"/>
<circle cx="270" cy="256.5" r="8" fill="#5EEAB5" opacity="0.25" filter="url(#bloom)"/>
<circle cx="270" cy="256.5" r="3" fill="#ffffff" filter="url(#softGlow)"/>
<circle cx="241.4" cy="295.5" r="8" fill="#5EEAB5" opacity="0.25" filter="url(#bloom)"/>
<circle cx="241.4" cy="295.5" r="3" fill="#ffffff" filter="url(#softGlow)"/>
<circle cx="298.6" cy="295.5" r="8" fill="#5EEAB5" opacity="0.25" filter="url(#bloom)"/>
<circle cx="298.6" cy="295.5" r="3" fill="#ffffff" filter="url(#softGlow)"/>

  <!-- 右侧识别面板 -->
  
  <!-- 玻璃面板 @(460,150) 310x280 -->
  <defs>
    <clipPath id="clip_460_150_310_280">
      <rect x="460" y="150" width="310" height="280" rx="22"/>
    </clipPath>
  </defs>
  <g filter="url(#dropShadow)">

    <g clip-path="url(#clip_460_150_310_280)">
      <!-- 模糊的彩色背景 -->
      <rect x="460" y="150" width="310" height="280" fill="url(#wallpaperBase)"/>
      <ellipse cx="522.0" cy="234.0" rx="124.0" ry="112.0" fill="url(#blobPurple)" filter="url(#glassBlur)"/>
      <ellipse cx="708.0" cy="346.0" rx="108.5" ry="98.0" fill="url(#blobBlue)" filter="url(#glassBlur)"/>
      <!-- 玻璃半透明叠层 -->
      <rect x="460" y="150" width="310" height="280" fill="url(#glassFill)"/>
      <!-- 顶部镜面高光 -->
      <rect x="460" y="150" width="310" height="140.0" rx="22" fill="url(#glassHighlight)"/>
    </g>

    <rect x="460" y="150" width="310" height="280" rx="22" fill="none"
          stroke="url(#glassEdge)" stroke-width="1.5"/>
    <rect x="461.5" y="151.5" width="307" height="277" rx="20.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  </g>
  <text x="490" y="195" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#F5F5F7" fill-opacity="1.0" text-anchor="start" filter="url(#txtShadow)">正在识别</text>
  <text x="490" y="220" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#AEAEB2" fill-opacity="1.0" text-anchor="start">多帧确认确保安全</text>

  <!-- 帧确认进度 -->
  <text x="490" y="260" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="500" fill="#AEAEB2" fill-opacity="1.0" text-anchor="start">多帧确认</text>
  
  <defs>
    <linearGradient id="pg_490_270" x1="0%" y1="0%" x2="100%" y2="0%">
