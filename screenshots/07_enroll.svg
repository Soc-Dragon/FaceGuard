<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">

<defs>
  <!-- ═══ 真实毛玻璃滤镜（背景模糊） ═══ -->
  <filter id="glassBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
  </filter>
  <filter id="glassBlurLg" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="28"/>
  </filter>
  <filter id="glassBlurSm" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
  </filter>

  <!-- ═══ 镜面高光滤镜（边缘折射） ═══ -->
  <filter id="specular" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
    <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.9"
                        specularExponent="25" lighting-color="#ffffff" result="spec">
      <feDistantLight azimuth="225" elevation="55"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
    <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic"
                 k1="0" k2="1" k3="0.8" k4="0"/>
  </filter>

  <!-- ═══ 液态折射滤镜（微扭曲） ═══ -->
  <filter id="liquidRefract" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018"
                  numOctaves="2" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>

  <!-- ═══ 发光 / 泛光滤镜 ═══ -->
  <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="bloomStrong" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- ═══ 背景壁纸渐变（macOS Sonoma 风格彩色网格） ═══ -->
  <linearGradient id="wallpaperBase" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#1A1033"/>
    <stop offset="35%" stop-color="#2D1B4E"/>
    <stop offset="65%" stop-color="#1E1A3D"/>
    <stop offset="100%" stop-color="#0D0F1E"/>
  </linearGradient>

  <!-- 彩色光斑 -->
  <radialGradient id="blobPurple" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#BF5AF2" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#BF5AF2" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#FF375F" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#FF375F" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blobOrange" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#FF9F0A" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#FF9F0A" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#0A84FF" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blobMint" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#30D58C" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#30D58C" stop-opacity="0"/>
  </radialGradient>

  <!-- ═══ 玻璃面板材质 ═══ -->
  <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.14"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
  </linearGradient>
  <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.35"/>
    <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
  </linearGradient>

  <!-- ═══ 强调色按钮渐变 ═══ -->
  <linearGradient id="btnMint" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"  stop-color="#5EEAB5"/>
    <stop offset="100%" stop-color="#28B574"/>
  </linearGradient>
  <linearGradient id="btnPurple" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"  stop-color="#D070FF"/>
    <stop offset="100%" stop-color="#9B30DC"/>
  </linearGradient>

  <!-- ═══ 流光边框（彩虹渐变） ═══ -->
  <linearGradient id="rainbowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#30D58C"/>
    <stop offset="25%"  stop-color="#5EEAB5"/>
    <stop offset="50%"  stop-color="#0A84FF"/>
    <stop offset="75%"  stop-color="#BF5AF2"/>
    <stop offset="100%" stop-color="#FF375F"/>
  </linearGradient>

  <!-- ═══ 扫描线渐变 ═══ -->
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#5EEAB5" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#5EEAB5" stop-opacity="1"/>
    <stop offset="100%" stop-color="#5EEAB5" stop-opacity="0"/>
  </linearGradient>

  <!-- ═══ 阴影滤镜 ═══ -->
  <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
  </filter>
  <filter id="dropShadowSm" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
  </filter>
  <filter id="txtShadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
  </filter>
</defs>


  <!-- 深色底 -->
  <rect width="800" height="600" fill="url(#wallpaperBase)"/>
  <!-- 彩色光斑（大模糊，模拟渐变网格） -->
  <ellipse cx="120.0" cy="120.0" rx="280.0" ry="210.0" fill="url(#blobPurple)" filter="url(#glassBlurLg)"/>
  <ellipse cx="680.0" cy="90.0" rx="240.0" ry="180.0" fill="url(#blobPink)" filter="url(#glassBlurLg)"/>
  <ellipse cx="640.0" cy="480.0" rx="280.0" ry="210.0" fill="url(#blobOrange)" filter="url(#glassBlurLg)"/>
  <ellipse cx="160.0" cy="510.0" rx="240.0" ry="180.0" fill="url(#blobBlue)" filter="url(#glassBlurLg)"/>
  <ellipse cx="400.0" cy="300.0" rx="200.0" ry="150.0" fill="url(#blobMint)" filter="url(#glassBlurLg)"/>
  <!-- 微粒噪点（模拟壁纸纹理） -->
  <rect width="800" height="600" fill="url(#wallpaperBase)" opacity="0.15"/>


  <rect x="30" y="30" width="740" height="540" rx="28" fill="#000000" opacity="0.25" filter="url(#dropShadow)"/>
  
  <ellipse cx="400" cy="229.5" rx="74.25" ry="94.5" fill="#3A3A5C" opacity="0.7"/>
  <path d="M298.75,378.0 Q298.75,297.0 400,297.0 Q501.25,297.0 501.25,378.0 Z" fill="#3A3A5C" opacity="0.7"/>

  <!-- 引导光晕 -->
  
  <defs>
    <radialGradient id="halo_8" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#BF5AF2" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#BF5AF2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#BF5AF2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="400" cy="260" r="180" fill="url(#halo_8)" filter="url(#bloomStrong)"/>

  <!-- 人脸框（圆角流光） -->
  <rect x="285" y="135" width="230" height="240" rx="22" fill="none"
        stroke="url(#rainbowBorder)" stroke-width="3" filter="url(#bloom)"/>

  <!-- 扫描线 -->
  
  <!-- 扫描线泛光带 -->
  <rect x="285" y="135" width="230" height="240" fill="none"/>
  <rect x="285" y="199.0" width="230" height="40" fill="#D070FF" opacity="0.08" filter="url(#glassBlur)"/>
  <rect x="285" y="211.0" width="230" height="16" fill="#D070FF" opacity="0.2" filter="url(#glassBlurSm)"/>
  <!-- 主扫描线 -->
  <rect x="285" y="218.0" width="230" height="2" fill="#D070FF" filter="url(#bloom)"/>

  <!-- 关键点连线 -->
<line x1="359.5" y1="239.75" x2="440.5" y2="239.75" stroke="#D070FF" stroke-width="1" stroke-opacity="0.35"/>
<line x1="440.5" y1="239.75" x2="400" y2="266.75" stroke="#D070FF" stroke-width="1" stroke-opacity="0.35"/>
<line x1="400" y1="266.75" x2="370.3" y2="307.25" stroke="#D070FF" stroke-width="1" stroke-opacity="0.35"/>
<line x1="400" y1="266.75" x2="429.7" y2="307.25" stroke="#D070FF" stroke-width="1" stroke-opacity="0.35"/>
<line x1="370.3" y1="307.25" x2="429.7" y2="307.25" stroke="#D070FF" stroke-width="1" stroke-opacity="0.35"/>
<!-- 发光关键点 -->
<circle cx="359.5" cy="239.75" r="8" fill="#D070FF" opacity="0.25" filter="url(#bloom)"/>
<circle cx="359.5" cy="239.75" r="3" fill="#ffffff" filter="url(#softGlow)"/>
<circle cx="440.5" cy="239.75" r="8" fill="#D070FF" opacity="0.25" filter="url(#bloom)"/>
<circle cx="440.5" cy="239.75" r="3" fill="#ffffff" filter="url(#softGlow)"/>
<circle cx="400" cy="266.75" r="8" fill="#D070FF" opacity="0.25" filter="url(#bloom)"/>
<circle cx="400" cy="266.75" r="3" fill="#ffffff" filter="url(#softGlow)"/>
<circle cx="370.3" cy="307.25" r="8" fill="#D070FF" opacity="0.25" filter="url(#bloom)"/>
<circle cx="370.3" cy="307.25" r="3" fill="#ffffff" filter="url(#softGlow)"/>
<circle cx="429.7" cy="307.25" r="8" fill="#D070FF" opacity="0.25" filter="url(#bloom)"/>
<circle cx="429.7" cy="307.25" r="3" fill="#ffffff" filter="url(#softGlow)"/>

  <!-- 顶部状态 -->
  
  <!-- 玻璃面板 @(30,40) 300x52 -->
  <defs>
    <clipPath id="clip_30_40_300_52">
      <rect x="30" y="40" width="300" height="52" rx="26"/>
    </clipPath>
  </defs>
  <g filter="url(#dropShadow)">

    <g clip-path="url(#clip_30_40_300_52)">
      <!-- 模糊的彩色背景 -->
      <rect x="30" y="40" width="300" height="52" fill="url(#wallpaperBase)"/>
      <ellipse cx="90.0" cy="55.6" rx="120.0" ry="20.8" fill="url(#blobPurple)" filter="url(#glassBlur)"/>
      <ellipse cx="270.0" cy="76.4" rx="105.0" ry="18.2" fill="url(#blobBlue)" filter="url(#glassBlur)"/>
      <!-- 玻璃半透明叠层 -->
      <rect x="30" y="40" width="300" height="52" fill="url(#glassFill)"/>
      <!-- 顶部镜面高光 -->
      <rect x="30" y="40" width="300" height="26.0" rx="26" fill="url(#glassHighlight)"/>
    </g>

    <rect x="30" y="40" width="300" height="52" rx="26" fill="none"
          stroke="url(#glassEdge)" stroke-width="1.5"/>
    <rect x="31.5" y="41.5" width="297" height="49" rx="24.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  </g>
  <circle cx="56" cy="66" r="6" fill="#BF5AF2" filter="url(#bloom)"/>
  <text x="72" y="71" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" fill-opacity="1.0" text-anchor="start" filter="url(#txtShadow)">FaceGuard</text>
  <text x="186" y="71" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="500" fill="#D070FF" fill-opacity="1.0" text-anchor="start">注册中</text>

  <!-- 采集进度 -->
  
  <!-- 玻璃面板 @(30,105) 380x48 -->
  <defs>
    <clipPath id="clip_30_105_380_48">
      <rect x="30" y="105" width="380" height="48" rx="24"/>
    </clipPath>
  </defs>
  <g filter="url(#dropShadow)">

    <g clip-path="url(#clip_30_105_380_48)">
      <!-- 模糊的彩色背景 -->
      <rect x="30" y="105" width="380" height="48" fill="url(#wallpaperBase)"/>
      <ellipse cx="106.0" cy="119.4" rx="152.0" ry="19.200000000000003" fill="url(#blobPurple)" filter="url(#glassBlur)"/>
      <ellipse cx="334.0" cy="138.6" rx="133.0" ry="16.799999999999997" fill="url(#blobBlue)" filter="url(#glassBlur)"/>
      <!-- 玻璃半透明叠层 -->
      <rect x="30" y="105" width="380" height="48" fill="url(#glassFill)"/>
      <!-- 顶部镜面高光 -->
      <rect x="30" y="105" width="380" height="24.0" rx="24" fill="url(#glassHighlight)"/>
    </g>

    <rect x="30" y="105" width="380" height="48" rx="24" fill="none"
          stroke="url(#glassEdge)" stroke-width="1.5"/>
    <rect x="31.5" y="106.5" width="377" height="45" rx="22.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  </g>
  <text x="50" y="135" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#D070FF" fill-opacity="1.0" text-anchor="start" filter="url(#txtShadow)">采集 5/8</text>
  <text x="145" y="135" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#AEAEB2" fill-opacity="1.0" text-anchor="start">请正对摄像头</text>

  <!-- 角度引导 -->
  
  <!-- 玻璃面板 @(430,105) 340x48 -->
  <defs>
    <clipPath id="clip_430_105_340_48">
      <rect x="430" y="105" width="340" height="48" rx="24"/>
    </clipPath>
  </defs>
  <g filter="url(#dropShadow)">

    <g clip-path="url(#clip_430_105_340_48)">
      <!-- 模糊的彩色背景 -->
      <rect x="430" y="105" width="340" height="48" fill="url(#wallpaperBase)"/>
      <ellipse cx="498.0" cy="119.4" rx="136.0" ry="19.200000000000003" fill="url(#blobPurple)" filter="url(#glassBlur)"/>
      <ellipse cx="702.0" cy="138.6" rx="118.99999999999999" ry="16.799999999999997" fill="url(#blobBlue)" filter="url(#glassBlur)"/>
      <!-- 玻璃半透明叠层 -->
      <rect x="430" y="105" width="340" height="48" fill="url(#glassFill)"/>
      <!-- 顶部镜面高光 -->
      <rect x="430" y="105" width="340" height="24.0" rx="24" fill="url(#glassHighlight)"/>
    </g>

    <rect x="430" y="105" width="340" height="48" rx="24" fill="none"
          stroke="url(#glassEdge)" stroke-width="1.5"/>
    <rect x="431.5" y="106.5" width="337" height="45" rx="22.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  </g>
  <text x="450" y="135" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="500" fill="#AEAEB2" fill-opacity="1.0" text-anchor="start">← 正面 → 左侧 → 右侧</text>
  <text x="750" y="135" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="700" fill="#D070FF" fill-opacity="1.0" text-anchor="end">当前: 正面</text>

  <!-- 底部进度条 -->
  
  <!-- 玻璃面板 @(30,520) 740x50 -->
  <defs>
    <clipPath id="clip_30_520_740_50">
      <rect x="30" y="520" width="740" height="50" rx="18"/>
    </clipPath>
  </defs>
  <g filter="url(#dropShadow)">

    <g clip-path="url(#clip_30_520_740_50)">
      <!-- 模糊的彩色背景 -->
      <rect x="30" y="520" width="740" height="50" fill="url(#wallpaperBase)"/>
      <ellipse cx="178.0" cy="535.0" rx="296.0" ry="20.0" fill="url(#blobPurple)" filter="url(#glassBlur)"/>
      <ellipse cx="622.0" cy="555.0" rx="259.0" ry="17.5" fill="url(#blobBlue)" filter="url(#glassBlur)"/>
      <!-- 玻璃半透明叠层 -->
      <rect x="30" y="520" width="740" height="50" fill="url(#glassFill)"/>
      <!-- 顶部镜面高光 -->
      <rect x="30" y="520" width="740" height="25.0" rx="18" fill="url(#glassHighlight)"/>
    </g>

    <rect x="30" y="520" width="740" height="50" rx="18" fill="none"
          stroke="url(#glassEdge)" stroke-width="1.5"/>
    <rect x="31.5" y="521.5" width="737" height="47" rx="16.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  </g>
  
  <defs>
    <linearGradient id="pg_60_540" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#D070FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D070FF" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="60" y="540" width="680" height="10" rx="5.0" fill="rgba(255,255,255,0.1)"/>
  <rect x="60" y="540" width="425.0" height="10" rx="5.0" fill="url(#pg_60_540)" filter="url(#bloom)"/>
  <text x="60" y="512" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="500" fill="#AEAEB2" fill-opacity="1.0" text-anchor="start">注册进度</text>
  <text x="740" y="512" font-family="Source Han Sans SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#D070FF" fill-opacity="1.0" text-anchor="end">62%</text>

  <path d="M180,196 L181.2,198.8 L184,200 L181.2,201.2 L180,204 L178.8,201.2 L176,200 L178.8,198.8 Z" fill="#D070FF" opacity="0.7" filter="url(#softGlow)"/>
  <path d="M620,177 L620.9,179.1 L623,180 L620.9,180.9 L620,183 L619.1,180.9 L617,180 L619.1,179.1 Z" fill="#D070FF" opacity="0.7" filter="url(#softGlow)"/>
  <path d="M150,397 L150.9,399.1 L153,400 L150.9,400.9 L150,403 L149.1,400.9 L147,400 L149.1,399.1 Z" fill="#ffffff" opacity="0.7" filter="url(#softGlow)"/>
</svg>